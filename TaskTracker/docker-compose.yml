version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: todo_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_web_app
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tododb;Username=todouser;Password=secretpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

volumes:
  pgdata:

networks:
  todo-network:
    driver: bridge
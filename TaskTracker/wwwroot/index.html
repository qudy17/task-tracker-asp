<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager с дедлайнами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .task-overdue {
            background-color: #ffe6e6 !important;
            border-left: 5px solid #dc3545 !important;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center text-primary mb-4">📝 Мои задачи</h2>
                        <form id="todoForm" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Название задачи</label>
                                <input type="text" id="title" class="form-control" placeholder="Что нужно сделать?" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Описание</label>
                                <input type="text" id="description" class="form-control" placeholder="Подробности (опционально)">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small">Срок (дедлайн)</label>
                                <input type="datetime-local" id="dueDate" class="form-control">
                            </div>
                            <div class="col-12 mt-3">
                                <button type="submit" class="btn btn-primary w-100">Добавить задачу</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Список задач</h5>
                        <ul id="todoList" class="list-group list-group-flush">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
